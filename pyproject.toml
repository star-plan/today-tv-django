[project]
name = "DjangoStarter"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "DealiAxy", email = "dealiaxy@gmail.com"},
]
dependencies = [
    # 项目中的既有模型仍使用 Django 5.0 支持的 index_together，避免解析到不兼容的 Django 6。
    "django[argon2]>=5.0.6,<5.1",
    # 现有账号 API 的 ModelSchema 仍使用 1.1 系列兼容写法，避免升级到移除该写法的新版。
    "django-ninja>=1.1.0,<1.2",
    "django-simpleui>=2024.4.1",
    "django-multi-captcha-admin>=2.0.0",
    "django-simple-captcha>=0.6.0",
    "django-cors-headers>=4.3.1",
    "django-ratelimit>=4.1.0",
    "orjson>=3.10.0",
    "pyjwt>=2.8.0",
    "wechatpy>=1.8.18",
    "django-redis>=5.4.0",
    "pycryptodome>=3.20.0",
    "tblib>=3.0.0",
    "jinja2>=3.1.4",
    "faker>=25.5.0",
    "django-split-settings>=1.3.1",
    "django-compressor>=4.5",
    "loguru>=0.7.2",
    "bs4>=0.0.2",
    "brotli>=1.1.0",
    "croniter>=3.0.3",
    "celery>=5.4.0",
    "django-celery-results>=2.5.1",
    "requests>=2.32.3",
    "redis>=5.0.8",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=8.1.1",
    "django-debug-toolbar>=4.3.0",
]
