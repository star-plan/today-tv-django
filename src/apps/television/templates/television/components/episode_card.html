<article class="episode-card">
    <a class="episode-cover" href="{% url 'television:video' video.id %}" aria-label="播放 {{ video.name }}">
        {% if video.cover_link %}
            <img src="{{ video.cover_link }}" alt="{{ video.name }} 的节目封面" loading="lazy">
        {% else %}
            <span class="cover-fallback">今日<br>视线</span>
        {% endif %}
        <span class="play-badge" aria-hidden="true">▶</span>
        <span class="episode-date">{{ video.time|date:'m.d' }}</span>
    </a>
    <div class="episode-body">
        <p class="episode-program">{{ video.program.name }}</p>
        <h3><a href="{% url 'television:video' video.id %}">{{ video.name }}</a></h3>
        <div class="episode-meta"><span>{{ video.time|date:'Y年m月d日' }}</span><span>播放节目</span></div>
    </div>
</article>
